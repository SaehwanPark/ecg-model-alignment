[project]
name = "ecg-model-alignment"
version = "0.1.0"
description = "Traditional ECG risk models vs multimodal transformer representations"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "huggingface-hub>=1.28.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pillow>=12.3.0",
    "polars>=1.44.0",
    "pyarrow>=25.0.1",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.1",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "transformers>=5.15.1",
    "wfdb>=4.3.1",
]

[project.scripts]
ecg-alignment = "ecg_alignment.cli:main"

[dependency-groups]
dev = [
  "basedpyright>=1.39.10",
  "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q"

[tool.basedpyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "standard"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ecg_alignment"]


