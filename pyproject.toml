[project]
name = "ecg-model-alignment"
version = "0.1.0"
description = "Traditional ECG risk models vs multimodal transformer representations"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pillow>=12.3.0",
    "polars>=1.44.0",
    "pyarrow>=25.0.1",
    "scipy>=1.18.1",
    "wfdb>=4.3.1",
]

[dependency-groups]
dev = [
  "basedpyright>=1.39.10",
  "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q"

[tool.basedpyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
